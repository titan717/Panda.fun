name: Build and Release Panda.fun Android TV APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Optional version name, e.g. 0.0.3"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: panda-android-tv-release
  cancel-in-progress: true

jobs:
  build-release:
    name: Build signed production Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Panda.fun
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ inputs.version_name }}" ]]; then
            VERSION_NAME="${{ inputs.version_name }}"
          else
            # Advance the patch version from the latest release tag so
            # automatic main-branch builds never reuse an existing tag.
            LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              VERSION_NAME="${MAJOR}.${MINOR}.$((PATCH + 1))"
            else
              VERSION_NAME="0.0.1"
            fi
          fi

          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version name: $VERSION_NAME"
            exit 1
          fi

          VERSION_CODE="${GITHUB_RUN_NUMBER}"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved: $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Verify production signing secrets
        shell: bash
        env:
          KINOMA_KEYSTORE_BASE64: ${{ secrets.KINOMA_KEYSTORE_BASE64 }}
          KINOMA_KEYSTORE_PASSWORD: ${{ secrets.KINOMA_KEYSTORE_PASSWORD }}
          KINOMA_KEY_ALIAS: ${{ secrets.KINOMA_KEY_ALIAS }}
          KINOMA_KEY_PASSWORD: ${{ secrets.KINOMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KINOMA_KEYSTORE_BASE64 KINOMA_KEYSTORE_PASSWORD KINOMA_KEY_ALIAS KINOMA_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Restore production keystore
        shell: bash
        env:
          KINOMA_KEYSTORE_BASE64: ${{ secrets.KINOMA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          printf '%s' "$KINOMA_KEYSTORE_BASE64" | base64 --decode > android/keystore/panda-release.keystore
          test -s android/keystore/panda-release.keystore
          chmod 600 android/keystore/panda-release.keystore

      - name: Configure Gradle signing and release version
        shell: bash
        env:
          KINOMA_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KINOMA_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          {
            echo "KINOMA_VERSION_CODE=$KINOMA_VERSION_CODE"
            echo "KINOMA_VERSION_NAME=$KINOMA_VERSION_NAME"
          } >> "$GITHUB_ENV"

      - name: Install web dependencies
        # package-lock.json is currently being reconciled with package.json; npm
        # install keeps the release build aligned with the checked-in manifest.
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Package web assets into Android app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -R dist/. android/app/src/main/assets/web/

      - name: Build signed release APK
        working-directory: android
        env:
          KINOMA_KEYSTORE_BASE64: ${{ secrets.KINOMA_KEYSTORE_BASE64 }}
          KINOMA_KEYSTORE_PASSWORD: ${{ secrets.KINOMA_KEYSTORE_PASSWORD }}
          KINOMA_KEY_ALIAS: ${{ secrets.KINOMA_KEY_ALIAS }}
          KINOMA_KEY_PASSWORD: ${{ secrets.KINOMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --version
          gradle clean assembleRelease --no-daemon --stacktrace --warning-mode all \
            -PKINOMA_VERSION_CODE="${KINOMA_VERSION_CODE}" \
            -PKINOMA_VERSION_NAME="${KINOMA_VERSION_NAME}"

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          mkdir -p release
          cp "$APK" release/Panda.fun-Android-TV.apk

          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose release/Panda.fun-Android-TV.apk
          fi

          sha256sum release/Panda.fun-Android-TV.apk | tee release/Panda.fun-Android-TV.apk.sha256

      - name: Publish GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Panda.fun Android TV v${{ steps.version.outputs.version_name }}
          body: |
            # Panda.fun Android TV v${{ steps.version.outputs.version_name }}

            Production signed Android TV release.

            - Version code: ${{ steps.version.outputs.version_code }}
            - APK: Panda.fun-Android-TV.apk
            - SHA-256 is published in the release asset and update manifest.
          files: |
            release/Panda.fun-Android-TV.apk
            release/Panda.fun-Android-TV.apk.sha256
          generate_release_notes: true

      - name: Publish update manifest to main
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RELEASE_TAG: v${{ steps.version.outputs.version_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          SHA256="$(sha256sum release/Panda.fun-Android-TV.apk | awk '{print $1}')"
          APK_URL="https://github.com/titan717/Panda.fun/releases/download/${RELEASE_TAG}/Panda.fun-Android-TV.apk"
          export SHA256 APK_URL

          python - <<'PY'
          import json, os
          data = {
              "latestVersionCode": int(os.environ["VERSION_CODE"]),
              "latestVersionName": os.environ["VERSION_NAME"],
              "releaseTag": os.environ["RELEASE_TAG"],
              "releaseNotes": f"Panda.fun Android TV {os.environ['VERSION_NAME']}",
              "apkUrl": os.environ["APK_URL"],
              "sha256": os.environ["SHA256"],
              "mandatory": False
          }
          with open("update/latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add update/latest.json
          git commit -m "chore(update): publish Panda.fun ${VERSION_NAME} manifest [skip ci]" || echo "latest.json already up to date"
          git push origin HEAD:main

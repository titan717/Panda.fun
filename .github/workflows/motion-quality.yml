name: Motion system quality gate

on:
  push:
    branches: [main, feat/premium-motion-system]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Report compressed frontend assets
        shell: bash
        run: |
          find dist -type f \( -name '*.js' -o -name '*.css' \) -print0 | xargs -0 -r gzip -c | wc -c | awk '{ printf "Combined gzipped JS/CSS bytes: %s\\n", $1 }'

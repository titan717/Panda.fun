name: Motion system quality gate

on:
  push:
    branches: [main, feat/premium-motion-system]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
      - name: Check out main for bundle baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build main baseline
        run: |
          npm ci --prefix baseline
          npm --prefix baseline run build
          BASELINE_GZIP=$(find baseline/dist/assets -type f \( -name '*.js' -o -name '*.css' \) -print0 | xargs -0 cat | gzip -c | wc -c)
          echo "BASELINE_GZIP=$BASELINE_GZIP" >> "$GITHUB_ENV"
          mv baseline "$RUNNER_TEMP/panda-motion-baseline"
      - name: Install feature dependencies
        run: npm ci
      - name: TypeScript lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Compare compressed frontend assets
        shell: bash
        run: |
          CURRENT_GZIP=$(find dist/assets -type f \( -name '*.js' -o -name '*.css' \) -print0 | xargs -0 cat | gzip -c | wc -c)
          DELTA=$((CURRENT_GZIP - BASELINE_GZIP))
          echo "main baseline: ${BASELINE_GZIP} bytes gzipped"
          echo "feature branch: ${CURRENT_GZIP} bytes gzipped"
          echo "delta: ${DELTA} bytes"
          if [ "$DELTA" -gt 15360 ]; then
            echo "::error::Gzipped asset delta exceeds the 15 KiB budget"
            exit 1
          fi

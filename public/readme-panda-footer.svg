<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Panda.fun mascot footer</title>
  <desc id="desc">The Panda.fun panda mascot floating above a playful glowing stage, surrounded by tiny sparkles and bamboo leaves.</desc>
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#a78bfa" stop-opacity=".13"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57d9a3"/>
      <stop offset="1" stop-color="#b69cff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <ellipse cx="480" cy="117" rx="215" ry="118" fill="url(#halo)" filter="url(#glow)">
    <animate attributeName="rx" values="200;220;200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;1;.7" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="480" cy="220" rx="130" ry="12" fill="#57d9a3" opacity=".12">
    <animate attributeName="rx" values="112;136;112" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M260 201Q480 158 700 201" fill="none" stroke="url(#beam)" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 9">
    <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="8s" repeatCount="indefinite"/>
  </path>

  <g fill="none" stroke="#57d9a3" stroke-width="2" stroke-linecap="round" opacity=".75">
    <path d="M311 86q-18-24-37-20q4 21 37 20q-12-27 4-37q17 19-4 37"/>
    <path d="M649 87q18-24 37-20q-4 21-37 20q12-27-4-37q-17 19 4 37"/>
  </g>
  <g fill="#b69cff">
    <path d="M284 101l4 10 10 4-10 4-4 10-4-10-10-4 10-4z">
      <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M684 116l3 8 8 3-8 3-3 8-3-8-8-3 8-3z">
      <animate attributeName="opacity" values="1;.25;1" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="360" cy="55" r="3"><animate attributeName="r" values="2;4;2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="601" cy="49" r="2.5"><animate attributeName="r" values="1.5;3.5;1.5" dur="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 4;0 0" keyTimes="0;.25;.5;.75;1" dur="4.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="-1 480 120;1 480 120;-1 480 120" dur="6.5s" repeatCount="indefinite"/>
    <image x="386" y="17" width="188" height="188" preserveAspectRatio="xMidYMid meet"
      href="https://raw.githubusercontent.com/titan717/titan717/main/assets/panda.webp"
      xlink:href="https://raw.githubusercontent.com/titan717/titan717/main/assets/panda.webp"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="480" y="235" font-size="17" font-weight="700" letter-spacing="3" fill="#d9fbe9">FIND YOUR NEXT WATCH</text>
    <text x="480" y="253" font-size="9" letter-spacing="2.7" fill="#b69cff">PRESS PLAY · STAY AWHILE</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="148" viewBox="0 0 960 148" role="img" aria-labelledby="title desc">
  <title id="title">Panda.fun — made for every screen</title>
  <desc id="desc">A subtle animated row of a television, phone, play symbol and sparkles.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57e3a2"/>
      <stop offset=".55" stop-color="#8bd8df"/>
      <stop offset="1" stop-color="#b79cff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162a2a"/>
      <stop offset="1" stop-color="#211d36"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82 112H878" stroke="url(#line)" stroke-opacity=".22" stroke-width="1.5"/>
    <path d="M82 112H878" stroke="url(#line)" stroke-width="1.5" stroke-dasharray="4 14">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(160 0)">
    <animateTransform attributeName="transform" type="translate" values="160 0;160 -4;160 0" dur="4.6s" repeatCount="indefinite"/>
    <rect x="-36" y="28" width="72" height="54" rx="11" fill="url(#screen)" stroke="#57e3a2" stroke-width="2.4"/>
    <path d="M-13 91h26M0 82v9" stroke="#57e3a2" stroke-width="2.4"/>
    <path d="M-7 43v24l21-12z" fill="#a9f5d3" stroke="none"/>
    <circle cx="29" cy="36" r="3" fill="#b79cff" stroke="none">
      <animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(373 0)">
    <animateTransform attributeName="transform" type="translate" values="373 0;373 -3;373 0" dur="4.1s" begin=".3s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 0 56;2 0 56;-2 0 56" dur="5s" repeatCount="indefinite"/>
      <rect x="-20" y="23" width="40" height="68" rx="9" fill="url(#screen)" stroke="#8bd8df" stroke-width="2.4"/>
      <rect x="-14" y="32" width="28" height="46" rx="3" fill="#19252d" stroke="#8bd8df" stroke-opacity=".45"/>
      <circle cx="0" cy="84" r="2.2" fill="#8bd8df" stroke="none"/>
      <path d="M-5 48v14l12-7z" fill="#c5f7eb" stroke="none"/>
    </g>
  </g>

  <g transform="translate(585 55)">
    <animateTransform attributeName="transform" type="translate" values="585 55;585 51;585 55" dur="3.8s" begin=".6s" repeatCount="indefinite"/>
    <circle r="35" fill="#211d36" fill-opacity=".9" stroke="#b79cff" stroke-width="2"/>
    <path d="M-9 -17v34l27-17z" fill="#d6c8ff" stroke="none"/>
    <circle cx="22" cy="-24" r="3" fill="#57e3a2" stroke="none">
      <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(795 55)" stroke="#b79cff" stroke-width="2.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="795 55;795 51;795 55" dur="4.4s" begin=".9s" repeatCount="indefinite"/>
    <path d="M0 -27V27M-27 0H27M-19 -19L19 19M19 -19L-19 19" opacity=".78">
      <animateTransform attributeName="transform" type="rotate" values="0;45;90" dur="18s" repeatCount="indefinite"/>
    </path>
    <circle r="7" fill="#57e3a2" stroke="none">
      <animate attributeName="r" values="5;8;5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="160" y="132" font-size="10" letter-spacing="2.5" fill="#57e3a2">TV</text>
    <text x="373" y="132" font-size="10" letter-spacing="2.5" fill="#8bd8df">MOBILE</text>
    <text x="585" y="132" font-size="10" letter-spacing="2.5" fill="#b79cff">PLAY</text>
    <text x="795" y="132" font-size="10" letter-spacing="2.5" fill="#b79cff">REPEAT</text>
  </g>
</svg>
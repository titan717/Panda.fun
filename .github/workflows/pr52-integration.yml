name: PR 52 integration and verification

on:
  push:
    branches: [ui/details-search-ott]

permissions:
  contents: write

concurrency:
  group: pr52-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ui/details-search-ott

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build current main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline

      - name: Install baseline dependencies and build
        run: |
          npm ci --prefix baseline
          npm --prefix baseline run build
          BASELINE_GZIP=$(find baseline/dist/assets -type f \( -name '*.js' -o -name '*.css' \) -print0 | xargs -0 cat | gzip -c | wc -c)
          echo "BASELINE_GZIP=$BASELINE_GZIP" >> "$GITHUB_ENV"
          mv baseline "$RUNNER_TEMP/panda-main-baseline"

      - name: Install happy-dom and regenerate lockfile
        run: npm install --save-dev happy-dom

      - name: Commit generated package manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "test: add happy-dom component test environment"
            git push origin HEAD:ui/details-search-ott
          else
            echo "happy-dom is already installed and the lockfile is current."
          fi

      - name: Clean install from committed lockfile
        run: npm ci

      - name: TypeScript lint
        run: npm run lint

      - name: Component and unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Compare gzipped frontend bundle with main
        shell: bash
        run: |
          CURRENT_GZIP=$(find dist/assets -type f \( -name '*.js' -o -name '*.css' \) -print0 | xargs -0 cat | gzip -c | wc -c)
          DELTA=$((CURRENT_GZIP - BASELINE_GZIP))
          echo "main baseline: ${BASELINE_GZIP} bytes gzipped"
          echo "PR #52: ${CURRENT_GZIP} bytes gzipped"
          echo "delta: ${DELTA} bytes"
          if [ "$DELTA" -gt 15360 ]; then
            echo "::error::Gzipped asset delta exceeds the 15 KiB budget"
            exit 1
          fi

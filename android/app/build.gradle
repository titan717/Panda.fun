plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def kinomaVersionCode = project.hasProperty("KINOMA_VERSION_CODE") ? project.getProperty("KINOMA_VERSION_CODE").toString().toInteger() : 1
def kinomaVersionName = project.hasProperty("KINOMA_VERSION_NAME") ? project.getProperty("KINOMA_VERSION_NAME").toString() : "1.0.0"

android {
    namespace 'com.kinoma.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.kinoma.tv"
        minSdk 21
        targetSdk 34
        versionCode kinomaVersionCode
        versionName kinomaVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            if (System.getenv("KINOMA_KEYSTORE_BASE64") != null) {
                storeFile file("${rootProject.projectDir}/keystore/panda-release.keystore")
                storePassword System.getenv("KINOMA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("KINOMA_KEY_ALIAS")
                keyPassword System.getenv("KINOMA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KINOMA_KEYSTORE_BASE64") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    
    // Compose for TV & Material
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.tv:tv-foundation:1.0.0-alpha10'
    implementation 'androidx.tv:tv-material:1.0.0-alpha10'
    
    // WebKit support for WebViewAssetLoader
    implementation 'androidx.webkit:webkit:1.10.0'

    // Leanback support
    implementation 'androidx.leanback:leanback:1.2.0-alpha04'

    // ExoPlayer / Media3 for TV Streaming
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'

    // Retrofit & Coroutines for Kinoma Backend API
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Coil for async image loading in TV cards
    implementation 'io.coil-kt:coil-compose:2.5.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

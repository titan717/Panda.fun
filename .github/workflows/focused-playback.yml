name: Focused playback verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test -- src/lib/vidyPlayerEvents.test.ts src/lib/mediaRoute.test.ts

name: Build and Publish Panda.fun Android TV Beta

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Optional beta version, e.g. 0.0.8-beta.1 (beta suffix is added automatically if omitted)"
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: panda-android-tv-beta
  cancel-in-progress: true

jobs:
  build-beta:
    name: Build signed Android TV beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Panda.fun
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve beta version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          INPUT_VERSION="${{ inputs.version_name }}"
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION_NAME="$INPUT_VERSION"
          else
            # Base the next beta on the latest stable semantic-version tag.
            LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- '-beta\.' | head -n 1 || true)"
            if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              VERSION_NAME="${MAJOR}.${MINOR}.$((PATCH + 1))-beta.${GITHUB_RUN_NUMBER}"
            else
              VERSION_NAME="0.0.1-beta.${GITHUB_RUN_NUMBER}"
            fi
          fi

          # Never publish this workflow as a stable release.
          if [[ ! "$VERSION_NAME" =~ -beta\.[0-9]+$ ]]; then
            VERSION_NAME="${VERSION_NAME}-beta.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Invalid beta version name: $VERSION_NAME"
            exit 1
          fi

          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved beta: $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Verify production signing secrets
        shell: bash
        env:
          KINOMA_KEYSTORE_BASE64: ${{ secrets.KINOMA_KEYSTORE_BASE64 }}
          KINOMA_KEYSTORE_PASSWORD: ${{ secrets.KINOMA_KEYSTORE_PASSWORD }}
          KINOMA_KEY_ALIAS: ${{ secrets.KINOMA_KEY_ALIAS }}
          KINOMA_KEY_PASSWORD: ${{ secrets.KINOMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KINOMA_KEYSTORE_BASE64 KINOMA_KEYSTORE_PASSWORD KINOMA_KEY_ALIAS KINOMA_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Restore signing keystore
        shell: bash
        env:
          KINOMA_KEYSTORE_BASE64: ${{ secrets.KINOMA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          printf '%s' "$KINOMA_KEYSTORE_BASE64" | base64 --decode > android/keystore/kinoma-release.keystore
          test -s android/keystore/kinoma-release.keystore
          chmod 600 android/keystore/kinoma-release.keystore

      - name: Configure Gradle version
        shell: bash
        env:
          KINOMA_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KINOMA_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          {
            echo "KINOMA_VERSION_CODE=$KINOMA_VERSION_CODE"
            echo "KINOMA_VERSION_NAME=$KINOMA_VERSION_NAME"
          } >> "$GITHUB_ENV"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check web application
        run: npm run lint

      - name: Run web tests
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Package web assets into Android app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -R dist/. android/app/src/main/assets/web/

      - name: Build signed beta APK
        working-directory: android
        env:
          KINOMA_KEYSTORE_BASE64: ${{ secrets.KINOMA_KEYSTORE_BASE64 }}
          KINOMA_KEYSTORE_PASSWORD: ${{ secrets.KINOMA_KEYSTORE_PASSWORD }}
          KINOMA_KEY_ALIAS: ${{ secrets.KINOMA_KEY_ALIAS }}
          KINOMA_KEY_PASSWORD: ${{ secrets.KINOMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --version
          gradle clean assembleRelease --no-daemon --stacktrace --warning-mode all \
            -PKINOMA_VERSION_CODE="${KINOMA_VERSION_CODE}" \
            -PKINOMA_VERSION_NAME="${KINOMA_VERSION_NAME}"

      - name: Verify beta APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p beta
          cp "$APK" beta/Panda.fun-Android-TV-beta.apk
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose beta/Panda.fun-Android-TV-beta.apk
          fi
          sha256sum beta/Panda.fun-Android-TV-beta.apk | tee beta/Panda.fun-Android-TV-beta.apk.sha256

      - name: Publish GitHub Beta (pre-release)
        id: beta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Panda.fun Android TV Beta v${{ steps.version.outputs.version_name }}
          prerelease: true
          make_latest: false
          body: |
            # Panda.fun Android TV Beta v${{ steps.version.outputs.version_name }}

            **Beta / pre-release build — not a stable release.**

            - Version code: ${{ steps.version.outputs.version_code }}
            - APK: Panda.fun-Android-TV-beta.apk
            - SHA-256 is attached alongside the APK.
          files: |
            beta/Panda.fun-Android-TV-beta.apk
            beta/Panda.fun-Android-TV-beta.apk.sha256
          generate_release_notes: true

      - name: Publish beta update manifest to main
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          BETA_TAG: v${{ steps.version.outputs.version_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA256="$(sha256sum beta/Panda.fun-Android-TV-beta.apk | awk '{print $1}')"
          APK_URL="https://github.com/titan717/Panda.fun/releases/download/${BETA_TAG}/Panda.fun-Android-TV-beta.apk"
          export SHA256 APK_URL

          python - <<'PY'
          import json, os
          data = {
              "latestVersionCode": int(os.environ["VERSION_CODE"]),
              "latestVersionName": os.environ["VERSION_NAME"],
              "releaseTag": os.environ["BETA_TAG"],
              "releaseNotes": f"Panda.fun Android TV Beta {os.environ['VERSION_NAME']}",
              "apkUrl": os.environ["APK_URL"],
              "sha256": os.environ["SHA256"],
              "mandatory": False,
              "channel": "beta",
              "prerelease": True
          }
          with open("update/latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add update/latest.json
          git commit -m "chore(update): publish Panda.fun beta ${VERSION_NAME} manifest [skip ci]" || echo "latest.json already up to date"
          git push origin HEAD:main

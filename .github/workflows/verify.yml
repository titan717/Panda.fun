name: Verify Panda.fun

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Generate Panda icon assets
        run: |
          python3 -m pip install --user CairoSVG Pillow
          npm run icons
      - run: npm run lint
      - run: npm test
      - run: npm run build

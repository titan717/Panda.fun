name: Focused route parsing

on:
  push:
    branches: [main]

jobs:
  route-parsing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test -- src/lib/mediaRoute.test.ts

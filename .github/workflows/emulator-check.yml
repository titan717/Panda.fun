name: Emulator check (icon, banner, splash, launch)

# Installs a published release APK on Android TV and phone emulators and captures
# launcher, splash and first-screen screenshots as artifacts (Mission §7 "verified on emulators").
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify, e.g. v1.0.5"
        required: true
        type: string

permissions:
  contents: read

jobs:
  emulator:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: android-tv-34, api: 34, target: android-tv, arch: x86, profile: tv_1080p }
          - { name: phone-34, api: 34, target: google_apis, arch: x86_64, profile: pixel_6 }
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p "*.apk" -D apk
          # previous stable release, to verify the in-app update path (install old → updater sees new → upgrade in place)
          CUR="${{ inputs.tag }}"
          PREV="$({ gh release list -R "${{ github.repository }}" --exclude-pre-releases --limit 40 --json tagName -q '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$CUR"; echo "$CUR"; } | sort -V | grep -B1 -x "$CUR" | grep -vx "$CUR" | head -1 || true)"
          echo "previous release: ${PREV:-none}"
          if [[ -n "$PREV" ]]; then gh release download "$PREV" -R "${{ github.repository }}" -p "*.apk" -D prev; echo "$PREV" > prev/TAG; fi
          ls -l apk prev || true

      # The headless emulator itself sometimes dies a few seconds after a WebView app starts ("error: closed",
      # seen on v1.1.5–v1.1.8 alike while earlier runs of the same APKs passed). Attempt 1 uses ANGLE on SwiftShader;
      # if the emulator or the check fails, attempt 2 starts a fresh emulator with the other GPU mode. An app problem
      # fails both attempts, so the job still fails.
      - name: Run on emulator and capture screenshots
        id: try1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator-check.sh ${{ matrix.name }}

      - name: Keep attempt 1 output
        if: steps.try1.outcome == 'failure'
        run: mkdir -p shots && [ -d shots ] && mkdir -p try1 && cp -r shots/. try1/ && rm -rf shots/* && mv try1 shots/attempt1 || true

      - name: Run on emulator (attempt 2, fresh emulator)
        if: steps.try1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator-check.sh ${{ matrix.name }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulator-${{ matrix.name }}-${{ inputs.tag }}
          path: shots/

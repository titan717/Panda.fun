name: Focused Details runtime check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  details-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test -- src/pages/Details.runtime.test.ts
